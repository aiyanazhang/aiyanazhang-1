<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机数生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, #0093E9 0%, #80D0C7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            color: #1a1a2e;
            margin-bottom: 35px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .inputs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .field {
            flex: 1;
        }
        .field span {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        input:focus {
            outline: none;
            border-color: #0093E9;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 147, 233, 0.1);
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #0093E9 0%, #80D0C7 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 35px;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 147, 233, 0.35);
        }
        .btn:active {
            transform: translateY(-1px);
        }
        .output {
            background: linear-gradient(135deg, #0093E9 0%, #80D0C7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 72px;
            font-weight: 700;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: -2px;
        }
        .output.animate {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>浮点随机数生成器</h1>
        <div class="inputs">
            <div class="field">
                <span>最小值</span>
                <input type="number" id="min" value="1">
            </div>
            <div class="field">
                <span>小数位数</span>
                <input type="number" id="precision" value="2" min="1" max="10" step="1">
            </div>
            <div class="field">
                <span>最大值</span>
                <input type="number" id="max" value="100">
            </div>
        </div>
        <button class="btn" onclick="generate()">生成随机数</button>
        <div class="output" id="output">?</div>
    </div>
    <script>
        function generate() {
            const min = parseFloat(document.getElementById('min').value) || 0;
            const max = parseFloat(document.getElementById('max').value) || 100;
            const precision = Math.max(1, Math.min(10, parseInt(document.getElementById('precision').value) || 2));
            const lo = Math.min(min, max);
            const hi = Math.max(min, max);
            const num = (Math.random() * (hi - lo) + lo).toFixed(precision);
            const el = document.getElementById('output');
            el.classList.remove('animate');
            void el.offsetWidth;
            el.classList.add('animate');
            el.textContent = num;
        }
    </script>
</body>
</html>
