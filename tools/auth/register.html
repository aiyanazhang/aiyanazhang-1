<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #c33;
        }

        .form-group .field-error {
            color: #c33;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-group .field-error.show {
            display: block;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .password-strength .strength-bar {
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .password-strength .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            background: #ccc;
        }

        .password-strength .strength-fill.weak {
            width: 33%;
            background: #f44336;
        }

        .password-strength .strength-fill.medium {
            width: 66%;
            background: #ff9800;
        }

        .password-strength .strength-fill.strong {
            width: 100%;
            background: #4caf50;
        }

        .password-strength .strength-text {
            color: #666;
            margin-top: 4px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 14px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 16px;
        }

        .back-home a {
            color: #999;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home a:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>用户注册</h1>
            <p>User Registration</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名 Username</label>
                <input type="text" id="username" name="username" required placeholder="3-30 characters">
                <div class="field-error" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label for="email">邮箱 Email</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
                <div class="field-error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">密码 Password</label>
                <input type="password" id="password" name="password" required placeholder="8+ chars, mixed case, numbers">
                <div class="field-error" id="passwordError"></div>
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">注册 Register</button>
        </form>

        <div class="footer">
            已有账号？ <a href="login.html">立即登录 Login</a>
        </div>

        <div class="back-home">
            <a href="/index.html">← 返回首页 Back to Home</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';

        const form = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const passwordInput = document.getElementById('password');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function showFieldError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + 'Error');
            const inputEl = document.getElementById(fieldId);
            errorEl.textContent = message;
            errorEl.classList.add('show');
            inputEl.classList.add('error');
        }

        function hideFieldError(fieldId) {
            const errorEl = document.getElementById(fieldId + 'Error');
            const inputEl = document.getElementById(fieldId);
            errorEl.classList.remove('show');
            inputEl.classList.remove('error');
        }

        function checkPasswordStrength(password) {
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            strengthFill.className = 'strength-fill';
            
            if (strength <= 2) {
                strengthFill.classList.add('weak');
                strengthText.textContent = '弱 Weak';
            } else if (strength <= 4) {
                strengthFill.classList.add('medium');
                strengthText.textContent = '中 Medium';
            } else {
                strengthFill.classList.add('strong');
                strengthText.textContent = '强 Strong';
            }
        }

        passwordInput.addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            hideFieldError('username');
            hideFieldError('email');
            hideFieldError('password');

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !email || !password) {
                showError('请填写所有字段 Please fill in all fields');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '注册中... Registering...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('access_token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    
                    window.location.href = '/index.html';
                } else {
                    if (data.errors) {
                        if (data.errors.username) showFieldError('username', data.errors.username[0]);
                        if (data.errors.email) showFieldError('email', data.errors.email[0]);
                        if (data.errors.password) showFieldError('password', data.errors.password[0]);
                    }
                    showError(data.message || '注册失败 Registration failed');
                }
            } catch (error) {
                showError('网络错误，请稍后重试 Network error, please try again');
                console.error('Registration error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '注册 Register';
            }
        });

        if (localStorage.getItem('access_token')) {
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
