<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Spark - Inspiring Thoughts</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-1: #1a1a2e;
            --bg-2: #16213e;
            --text: #ffffff;
            --accent: #e94560;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            transition: background 0.8s ease;
            overflow-x: hidden;
        }

        /* Themes */
        .theme-midnight { --bg-1: #0f0c29; --bg-2: #302b63; --accent: #a855f7; }
        .theme-ocean { --bg-1: #0f2027; --bg-2: #2c5364; --accent: #38bdf8; }
        .theme-sunset { --bg-1: #ee9ca7; --bg-2: #ffdde1; --text: #1a1a2e; --accent: #be185d; }
        .theme-forest { --bg-1: #134e5e; --bg-2: #71b280; --accent: #fbbf24; }
        .theme-rose { --bg-1: #360033; --bg-2: #0b8793; --accent: #f472b6; }
        .theme-dawn { --bg-1: #2c3e50; --bg-2: #fd746c; --accent: #fef08a; }

        body {
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 0.9rem;
            letter-spacing: 3px;
            opacity: 0.7;
            font-weight: 300;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .quote-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            text-align: center;
        }

        .quote-card {
            max-width: 700px;
            padding: 60px 40px;
            position: relative;
        }

        .quote-mark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 8rem;
            position: absolute;
            top: -20px;
            left: 0;
            opacity: 0.1;
            line-height: 1;
            color: var(--accent);
        }

        .quote-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 30px;
            font-style: italic;
            animation: fadeUp 0.6s ease;
        }

        .quote-author {
            font-size: 1rem;
            letter-spacing: 2px;
            opacity: 0.7;
            font-weight: 300;
            animation: fadeUp 0.6s ease 0.2s both;
        }

        .quote-author::before {
            content: '— ';
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 16px 32px;
            border-radius: 50px;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
        }

        .primary-btn {
            background: var(--accent);
            color: white;
            font-weight: 500;
        }

        .primary-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .secondary-btn {
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .secondary-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .secondary-btn.favorited {
            background: rgba(233, 69, 96, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Theme Selector */
        .theme-panel {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            padding: 30px;
            transition: right 0.3s ease;
            z-index: 100;
            overflow-y: auto;
        }

        .theme-panel.open { right: 0; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .panel-title {
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .theme-option {
            height: 80px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .theme-option:hover { transform: scale(1.05); }
        .theme-option.active { border-color: white; }

        .theme-option span {
            position: absolute;
            bottom: 8px;
            left: 10px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .theme-midnight-preview { background: linear-gradient(135deg, #0f0c29, #302b63); }
        .theme-ocean-preview { background: linear-gradient(135deg, #0f2027, #2c5364); }
        .theme-sunset-preview { background: linear-gradient(135deg, #ee9ca7, #ffdde1); }
        .theme-forest-preview { background: linear-gradient(135deg, #134e5e, #71b280); }
        .theme-rose-preview { background: linear-gradient(135deg, #360033, #0b8793); }
        .theme-dawn-preview { background: linear-gradient(135deg, #2c3e50, #fd746c); }

        /* Favorites Panel */
        .favorites-section {
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .fav-item {
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .fav-item:hover { background: rgba(255,255,255,0.1); }

        .fav-quote {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .fav-author {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .empty-fav {
            text-align: center;
            opacity: 0.5;
            padding: 30px;
            font-size: 0.85rem;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 50;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 200;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Canvas for sharing */
        #shareCanvas {
            display: none;
        }

        /* Swipe hint */
        .swipe-hint {
            text-align: center;
            opacity: 0.4;
            font-size: 0.8rem;
            margin-top: 30px;
            letter-spacing: 1px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .quote-card { padding: 40px 20px; }
            .quote-mark { font-size: 5rem; }
            .action-btn { padding: 14px 24px; font-size: 0.85rem; }
        }
    </style>
</head>
<body class="theme-midnight">
    <div class="container">
        <header>
            <div class="logo">DAILY SPARK</div>
            <div class="header-actions">
                <button class="icon-btn" id="favListBtn" title="Favorites">&#9829;</button>
                <button class="icon-btn" id="themeBtn" title="Themes">&#9681;</button>
            </div>
        </header>

        <section class="quote-section">
            <div class="quote-card" id="quoteCard">
                <span class="quote-mark">"</span>
                <p class="quote-text" id="quoteText"></p>
                <p class="quote-author" id="quoteAuthor"></p>
            </div>

            <div class="actions">
                <button class="secondary-btn" id="favoriteBtn">
                    <span id="favIcon">&#9825;</span> Save
                </button>
                <button class="primary-btn" id="newQuoteBtn">
                    New Quote
                </button>
                <button class="secondary-btn" id="shareBtn">
                    &#8599; Share
                </button>
            </div>

            <p class="swipe-hint">Swipe or press Space for new quote</p>
        </section>
    </div>

    <!-- Theme Panel -->
    <div class="overlay" id="overlay"></div>
    <div class="theme-panel" id="themePanel">
        <div class="panel-header">
            <span class="panel-title">THEMES</span>
            <button class="close-btn" id="closePanel">&times;</button>
        </div>
        <div class="theme-grid">
            <div class="theme-option theme-midnight-preview active" data-theme="midnight"><span>Midnight</span></div>
            <div class="theme-option theme-ocean-preview" data-theme="ocean"><span>Ocean</span></div>
            <div class="theme-option theme-sunset-preview" data-theme="sunset"><span>Sunset</span></div>
            <div class="theme-option theme-forest-preview" data-theme="forest"><span>Forest</span></div>
            <div class="theme-option theme-rose-preview" data-theme="rose"><span>Rose</span></div>
            <div class="theme-option theme-dawn-preview" data-theme="dawn"><span>Dawn</span></div>
        </div>

        <div class="favorites-section">
            <div class="panel-title" style="margin-bottom: 15px;">SAVED QUOTES</div>
            <div id="favoritesList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <canvas id="shareCanvas"></canvas>

    <script>
        const quotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
            { text: "What you seek is seeking you.", author: "Rumi" },
            { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb" },
            { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
            { text: "The only impossible journey is the one you never begin.", author: "Tony Robbins" },
            { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", author: "Ralph Waldo Emerson" },
            { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
            { text: "It is during our darkest moments that we must focus to see the light.", author: "Aristotle" },
            { text: "The mind is everything. What you think you become.", author: "Buddha" },
            { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" },
            { text: "The journey of a thousand miles begins with one step.", author: "Lao Tzu" },
            { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" },
            { text: "The only limit to our realization of tomorrow is our doubts of today.", author: "Franklin D. Roosevelt" },
            { text: "Everything you can imagine is real.", author: "Pablo Picasso" },
            { text: "Turn your wounds into wisdom.", author: "Oprah Winfrey" },
            { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
            { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
            { text: "You must be the change you wish to see in the world.", author: "Mahatma Gandhi" },
            { text: "Happiness is not something ready made. It comes from your own actions.", author: "Dalai Lama" },
            { text: "The only person you are destined to become is the person you decide to be.", author: "Ralph Waldo Emerson" },
            { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle" },
            { text: "In three words I can sum up everything I've learned about life: it goes on.", author: "Robert Frost" },
            { text: "The purpose of life is not to be happy. It is to be useful, to be honorable, to be compassionate.", author: "Ralph Waldo Emerson" },
            { text: "Stay hungry, stay foolish.", author: "Steve Jobs" }
        ];

        let currentQuote = null;
        let currentTheme = 'midnight';
        let favorites = JSON.parse(localStorage.getItem('dailySparkFavorites')) || [];

        function getRandomQuote() {
            const index = Math.floor(Math.random() * quotes.length);
            return quotes[index];
        }

        function displayQuote(quote) {
            currentQuote = quote;
            document.getElementById('quoteText').textContent = quote.text;
            document.getElementById('quoteAuthor').textContent = quote.author;
            
            document.getElementById('quoteText').style.animation = 'none';
            document.getElementById('quoteAuthor').style.animation = 'none';
            setTimeout(() => {
                document.getElementById('quoteText').style.animation = 'fadeUp 0.6s ease';
                document.getElementById('quoteAuthor').style.animation = 'fadeUp 0.6s ease 0.2s both';
            }, 10);

            updateFavoriteButton();
        }

        function updateFavoriteButton() {
            const isFav = favorites.some(f => f.text === currentQuote.text);
            const btn = document.getElementById('favoriteBtn');
            const icon = document.getElementById('favIcon');
            
            if (isFav) {
                btn.classList.add('favorited');
                icon.innerHTML = '&#9829;';
            } else {
                btn.classList.remove('favorited');
                icon.innerHTML = '&#9825;';
            }
        }

        function toggleFavorite() {
            const index = favorites.findIndex(f => f.text === currentQuote.text);
            
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('Removed from favorites');
            } else {
                favorites.unshift(currentQuote);
                showToast('Added to favorites');
            }
            
            localStorage.setItem('dailySparkFavorites', JSON.stringify(favorites));
            updateFavoriteButton();
            renderFavorites();
        }

        function renderFavorites() {
            const container = document.getElementById('favoritesList');
            
            if (favorites.length === 0) {
                container.innerHTML = '<div class="empty-fav">No saved quotes yet</div>';
                return;
            }

            container.innerHTML = favorites.map((q, i) => `
                <div class="fav-item" onclick="loadFavorite(${i})">
                    <div class="fav-quote">"${q.text.substring(0, 60)}${q.text.length > 60 ? '...' : ''}"</div>
                    <div class="fav-author">- ${q.author}</div>
                </div>
            `).join('');
        }

        function loadFavorite(index) {
            displayQuote(favorites[index]);
            closePanel();
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.body.className = `theme-${theme}`;
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.theme === theme);
            });
            localStorage.setItem('dailySparkTheme', theme);
        }

        function openPanel() {
            document.getElementById('themePanel').classList.add('open');
            document.getElementById('overlay').classList.add('show');
        }

        function closePanel() {
            document.getElementById('themePanel').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        async function shareQuote() {
            const canvas = document.getElementById('shareCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 1080;
            canvas.height = 1080;

            const gradients = {
                midnight: ['#0f0c29', '#302b63'],
                ocean: ['#0f2027', '#2c5364'],
                sunset: ['#ee9ca7', '#ffdde1'],
                forest: ['#134e5e', '#71b280'],
                rose: ['#360033', '#0b8793'],
                dawn: ['#2c3e50', '#fd746c']
            };

            const colors = gradients[currentTheme];
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(1, colors[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const textColor = currentTheme === 'sunset' ? '#1a1a2e' : '#ffffff';
            
            ctx.fillStyle = textColor;
            ctx.globalAlpha = 0.1;
            ctx.font = 'italic 300px Georgia';
            ctx.fillText('"', 80, 280);
            ctx.globalAlpha = 1;

            ctx.font = 'italic 48px Georgia';
            ctx.fillStyle = textColor;
            
            const words = currentQuote.text.split(' ');
            let lines = [];
            let currentLine = '';
            const maxWidth = 900;

            words.forEach(word => {
                const testLine = currentLine + word + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && currentLine) {
                    lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine = testLine;
                }
            });
            lines.push(currentLine.trim());

            const lineHeight = 70;
            const startY = (canvas.height - lines.length * lineHeight) / 2;

            lines.forEach((line, i) => {
                ctx.fillText(line, 90, startY + i * lineHeight);
            });

            ctx.font = '28px Arial';
            ctx.globalAlpha = 0.7;
            ctx.fillText('— ' + currentQuote.author, 90, startY + lines.length * lineHeight + 60);

            ctx.globalAlpha = 0.4;
            ctx.font = '20px Arial';
            ctx.fillText('DAILY SPARK', 90, canvas.height - 60);

            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                
                if (navigator.share && navigator.canShare({ files: [new File([blob], 'quote.png', { type: 'image/png' })] })) {
                    await navigator.share({
                        files: [new File([blob], 'quote.png', { type: 'image/png' })],
                        title: 'Daily Spark',
                        text: `"${currentQuote.text}" - ${currentQuote.author}`
                    });
                } else {
                    const link = document.createElement('a');
                    link.download = 'daily-spark-quote.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('Image downloaded');
                }
            } catch (e) {
                const text = `"${currentQuote.text}" - ${currentQuote.author}`;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text);
                    showToast('Quote copied to clipboard');
                }
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Event Listeners
        document.getElementById('newQuoteBtn').addEventListener('click', () => displayQuote(getRandomQuote()));
        document.getElementById('favoriteBtn').addEventListener('click', toggleFavorite);
        document.getElementById('shareBtn').addEventListener('click', shareQuote);
        document.getElementById('themeBtn').addEventListener('click', openPanel);
        document.getElementById('favListBtn').addEventListener('click', openPanel);
        document.getElementById('closePanel').addEventListener('click', closePanel);
        document.getElementById('overlay').addEventListener('click', closePanel);

        document.querySelectorAll('.theme-option').forEach(opt => {
            opt.addEventListener('click', () => setTheme(opt.dataset.theme));
        });

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
                displayQuote(getRandomQuote());
            }
        });

        // Touch swipe
        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
        document.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) displayQuote(getRandomQuote());
        });

        // Initialize
        const savedTheme = localStorage.getItem('dailySparkTheme') || 'midnight';
        setTheme(savedTheme);
        displayQuote(getRandomQuote());
        renderFavorites();
    </script>
</body>
</html>
